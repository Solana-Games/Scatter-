server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy no-referrer;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://scaterx-api;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
