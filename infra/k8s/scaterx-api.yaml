apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaterx-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scaterx-api
  template:
    metadata:
      labels:
        app: scaterx-api
    spec:
      containers:
        - name: api
          image: ghcr.io/solana-games/scaterx-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: scaterx-api
spec:
  selector:
    app: scaterx-api
  ports:
    - port: 80
      targetPort: 4000
