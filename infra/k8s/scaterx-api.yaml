apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaterx-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaterx-api
  template:
    metadata:
      labels:
        app: scaterx-api
    spec:
      containers:
        - name: api
          image: ghcr.io/solana-games/scaterx-api:1.0.0
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: scaterx-api
spec:
  selector:
    app: scaterx-api
  ports:
    - port: 80
      targetPort: 4000
